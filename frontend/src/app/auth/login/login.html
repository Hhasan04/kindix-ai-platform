<div class="auth-page">
  <form class="auth-card" (submit)="$event.preventDefault(); submit()">
    <h1 class="auth-title">KINDIX</h1>
    <p class="auth-subtitle">Sign in to your account</p>

    <label class="field">
      <span class="field-label">Email</span>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        [disabled]="loading"
        required
        autocomplete="email"
      />
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        [disabled]="loading"
        required
        autocomplete="current-password"
      />
    </label>

    @if (error) {
      <div class="auth-error">{{ error }}</div>
    }

    <button type="submit" class="auth-submit" [disabled]="loading || !email.trim() || !password">
      {{ loading ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/register">Register your school</a>
    </p>
  </form>
</div>
