services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kindix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  n8n:
    image: n8nio/n8n:latest
    container_name: kindix-n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - TZ=Asia/Hebron
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  adminer:
    image: adminer
    container_name: kindix-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  embedding-service:
    build: ../knowledge-base
    container_name: kindix-embedding
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - embedding_cache:/root/.cache/huggingface

  backend:
    build: ../backend
    container_name: kindix-backend
    restart: unless-stopped
    # Compose only auto-loads a .env file that sits next to THIS compose file
    # (infra/.env, which holds POSTGRES_*/N8N_*) -- it does not see the
    # repo-root .env, so GEMINI_API_KEY/GEMINI_MODEL/LLM_PROVIDER/JWT_SECRET
    # can't be picked up via ${...} substitution here. env_file loads the
    # root .env's values directly into the container instead; the explicit
    # `environment:` keys below still win over it for the Docker-network
    # specific overrides (DB_HOST/DB_PORT/etc).
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      EMBEDDING_SERVICE_URL: http://embedding-service:8001
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - embedding-service

  frontend:
    build: ../frontend
    container_name: kindix-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  n8n_data:
  embedding_cache:
